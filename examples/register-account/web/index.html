<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register Account</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="register-container">

        <section class="register-card">

            <div class="logo">
                SAMP
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Create your account to continue.
            </p>

            <form id="register-form">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        id="username"
                        type="text"
                        placeholder="Enter username"
                        autocomplete="off"
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="Enter email"
                        autocomplete="off"
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter password"
                    >

                </div>

                <button
                    id="register-button"
                    type="submit"
                >
                    Create Account
                </button>

            </form>

            <p
                id="message"
                class="message"
            ></p>

        </section>

    </main>

    <script src="cef.js"></script>
    <script src="app.js"></script>

</body>

</html>
